# Process allowlist — comm names exempt from AUTOMATIC containment because they
# are known, trusted, and have unusual-but-legitimate behaviour (init systems,
# remote-access daemons, package managers). Read by kbd (--allowlist); re-read
# on `kbctl policy reload`.
#
# What an entry does, and does not do:
#   * An entry is honoured ONLY when the running process's real executable
#     (/proc/<pid>/exe) is under a trusted system directory (/usr/bin, /usr/sbin,
#     /bin, /sbin, /usr/lib/systemd, /lib/systemd, /usr/libexec). comm is chosen
#     by the process itself, so a name match alone proves nothing: malware that
#     calls itself "systemd" from /tmp is NOT exempt, and neither is a process
#     that has exited or whose binary was deleted (fails closed).
#   * It suppresses automatic containment only (the BORDERLANDS throttle,
#     auto_terminate). Zone changes are still recorded, reported and audited; the
#     zone_transition event carries allowlisted=<reason>, and an
#     ALLOWLIST_EXEMPT_* audit entry is written whenever the exemption applies.
#   * Keep it short. A name like cat, tar or python cannot safely be listed: an
#     attacker can run those too. Prefer thresholds in policy.yaml for those.

allow:
  - comm: systemd
    reason: "PID 1 / init system"
  - comm: sshd
    reason: "Trusted remote access daemon"