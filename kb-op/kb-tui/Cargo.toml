[package]
name = "kb-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.26.1"
crossterm = { version = "0.27.0", features = ["event-stream"] }
tokio = { version = "1.35", features = ["full", "process"] } # 👈 Added "process" feature to support launching your MCP server
tonic = { version = "0.10", features = ["codegen", "prost"] }
prost = "0.12"
tower = { version = "0.4", features = ["util"] }
futures = "0.3"
rand = { version = "0.8", features = ["small_rng"] }

# ---------------------------------------------------------
# 🛠️ Added for Vite Dashboard Web Server Integration
# ---------------------------------------------------------
axum = "0.7"
rust-embed = "8.0"
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
tonic-build = "0.10"
is-terminal = "0.4"
