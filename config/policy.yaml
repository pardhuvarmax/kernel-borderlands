defaults:
  suspicious:   40.0
  borderlands:  75.0

# Additional paths tracked by the kernel LSM hook (lsm/file_open), on top
# of the compiled-in floor (/etc/shadow, /etc/sudoers, /root/.ssh/) in
# kb-core/userspace/sensor/kbd_sensor.c. Entries here are ADDITIVE ONLY —
# they can never remove or replace the compiled-in floor. Must be
# absolute paths, <= 63 bytes (fixed-size BPF map key), not bare "/".
# Takes effect on kbd_sensor (re)connect — not a live reload.
#
# NOTE: reads of these paths are always flagged for behavioral scoring,
# for every process. The hard -EACCES block only applies to a process
# already under operator containment at level >= 2 (Seccomp) — it is not
# a blanket block on normal system operation (sudo/PAM reading
# /etc/sudoers, /etc/shadow, etc. are unaffected unless already contained).
sensitive_paths: []
  # Add deployment-specific absolute paths here. (A lab test path used to ship
  # in this list; scripts/attack-lab/containment_demo.py needs it added by hand.)

# known_destinations (default empty): IPv4 addresses or CIDRs the operator
# vouches for, e.g. an offsite backup host. kbd exports dest_known=1 for a
# process whose most recent connection went to one (feature schema v3), so a
# model or analyst can tell "my backup server" from another host at the same
# kind of address. It is an input feature only: it never suppresses
# containment. A bad entry rejects the whole list; prefixes shorter than /8
# are refused. Takes effect on `kbctl policy reload`.
known_destinations: []
  # - 10.20.0.5
  # - 192.168.50.0/24

# auto_namespace_on_exfil_beacon (per-comm, default false): opt a process
# into automatic NAMESPACE containment when internal/detection's
# beaconing/exfiltration detector (docs/development/control-aads/
# dev-exfiltration-detection.md) flags it. Off by default — a statistical
# timing/frequency heuristic has real false-positive risk, so
# auto-enforcement stays an explicit per-comm choice, same posture as
# auto_terminate below.
policies:
  - comm: nginx
    suspicious:   55.0
    borderlands:  85.0
    allow_network: true
    auto_terminate: false

  - comm: postgres
    suspicious:   50.0
    borderlands:  80.0
    allow_network: false
    auto_terminate: false  # TERMINATE really kills since 1.1.0; opt in per deployment, not by default

  - comm: bash
    suspicious:   45.0
    borderlands:  70.0
    auto_terminate: false
